<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Item - Lost & Found Campus</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                Lost & Found Campus
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Lost Items</a></li>
                <li><a href="#">Found Items</a></li>
                <li><a href="report.html">Report Item</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

        </nav>
    </header>


    <!-- Report Section -->
    <section class="report-section">

        <div class="report-container">

            <h1>Report an Item</h1>

            <p>
                Help someone recover their lost item by providing
                the details below.
            </p>


            <!-- Report Form -->
            <form id="reportForm">

                <!-- Item Status -->
                <div class="form-group">

                    <label for="itemStatus">
                        Item Status
                    </label>

                    <select id="itemStatus" name="itemStatus" required>

                        <option value="">
                            Select Status
                        </option>

                        <option value="Lost">
                            I Lost an Item
                        </option>

                        <option value="Found">
                            I Found an Item
                        </option>

                    </select>

                </div>


                <!-- Item Name -->
                <div class="form-group">

                    <label for="itemName">
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="itemName"
                        name="itemName"
                        placeholder="Example: College ID Card"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" name="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Documents">
                            Documents
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="Others">
                            Others
                        </option>

                    </select>

                </div>


                <!-- Description -->
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Describe the item..."
                        required
                    ></textarea>

                </div>


                <!-- Location -->
                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: College Library"
                        required
                    >

                </div>


                <!-- Date -->
                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <!-- Contact Name -->
                <div class="form-group">

                    <label for="contactName">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="contactName"
                        name="contactName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>


                <!-- Submit Button -->
                <button type="submit" class="submit-btn">
                    Submit Report
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Lost & Found Campus
        </p>

        <p>
            A Campus Web Technology Project
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
